<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elmstead viewer</title>
    <style>
      html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; background: #f4f4f2; color: #1a1a1a; }
      #container { position: absolute; inset: 0; }
      #bar { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
             background: rgba(255,255,255,.92); padding: 8px 10px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
      #bar button, #bar select { font: inherit; padding: 3px 8px; }
      #labels[aria-pressed="true"] { font-weight: 600; }
      #constraints[aria-pressed="true"] { font-weight: 600; }
      #walk[aria-pressed="true"] { font-weight: 600; }
      #status { color: #666; margin-left: 4px; }
      body.snapshot #bar { display: none; }
      #walk-hint { position: absolute; left: 50%; bottom: 48px; transform: translateX(-50%);
                   background: rgba(255,255,255,.92); padding: 8px 14px; border-radius: 8px;
                   box-shadow: 0 1px 4px rgba(0,0,0,.15); pointer-events: none; white-space: nowrap; }
      #walk-hint[hidden] { display: none; }
      body.snapshot #walk-hint { display: none; }
      #compass { position: absolute; right: 16px; bottom: 16px; width: 90px; height: 90px; pointer-events: none; }
      #compass svg { display: block; width: 100%; height: 100%; }
      #compass[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="bar">
      <select id="model" title="Model in out/"></select>
      <span>View:</span>
      <button data-view="sw">SW</button><button data-view="se">SE</button>
      <button data-view="ne">NE</button><button data-view="nw">NW</button>
      <button data-view="top">Top</button>
      <button id="labels" title="Room labels and dimensions">Labels</button>
      <button id="constraints" title="Measured constraints as red labels and dotted lines">Constraints</button>
      <button id="walk" title="First-person walk mode">Walk</button>
      <span id="status"></span>
    </div>
    <div id="compass" hidden><svg viewBox="-45 -45 90 90" role="img" aria-label="True north">
      <circle r="22" fill="rgba(255,255,255,.85)" stroke="#1a1a1a" stroke-width="1" />
      <polygon id="compass-arrow" points="0,-20 8,10 0,4 -8,10" fill="#1a1a1a" />
      <text id="compass-n" x="0" y="-28" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a"
            stroke="#f4f4f2" stroke-width="3" paint-order="stroke">N</text>
    </svg></div>
    <div id="walk-hint" hidden>Click to look around · WASD or arrow keys to move · Esc to leave</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
